name: 1. Generate Daily Draft for Review

on:
  schedule:
    # Runs at 10:30 UTC (4:00 PM IST) every day
    - cron: '30 10 * * *'
  # Allows manual runs or backup cron-job.org triggers anytime
  workflow_dispatch:
    inputs:
      track:
        description: 'Technology track override (auto uses series_state.json)'
        required: false
        type: choice
        default: 'auto'
        options:
          - auto
          - dotnet
          - angular
          - sql_server
      day:
        description: 'Day number 1-30 override (leave empty to use series_state.json)'
        required: false
        type: string
      force:
        description: 'Force regenerate even if an open draft for today already exists'
        required: false
        type: boolean
        default: false
      carousel:
        description: 'Also generate a 4-slide PDF carousel artifact'
        required: false
        type: boolean
        default: false

concurrency:
  group: daily-draft-review
  cancel-in-progress: false

jobs:
  generate-draft:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for Existing Open Draft (Same-Day Duplicate Guard)
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TRACK: ${{ inputs.track }}
          INPUT_DAY: ${{ inputs.day }}
          INPUT_FORCE: ${{ inputs.force }}
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          force = os.environ.get("INPUT_FORCE", "false").lower() == "true"
          state = json.loads(Path("series_state.json").read_text(encoding="utf-8"))
          day = os.environ.get("INPUT_DAY", "").strip() or str(state.get("day", 1))
          prefix = f"📝 Review Draft: Day {day} -"

          existing_raw = subprocess.check_output(
              ["gh", "issue", "list", "--state", "open", "--json", "number,title"],
              text=True,
          )
          has_same_day = any(
              str(item.get("title", "")).startswith(prefix)
              for item in json.loads(existing_raw)
          )
          skip = "true" if (has_same_day and not force) else "false"
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"skip={skip}\n")
          if skip == "true":
              print(f"Open draft for Day {day} already exists and force=false; skipping duplicate generation.")
          PY

      - name: Set up Python
        if: steps.guard.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        if: steps.guard.outputs.skip != 'true'
        run: pip install requests pillow

      - name: Generate Post Draft & Visual Card
        if: steps.guard.outputs.skip != 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          INPUT_TRACK: ${{ inputs.track }}
          INPUT_DAY: ${{ inputs.day }}
          INPUT_CAROUSEL: ${{ inputs.carousel }}
        run: |
          python - <<'PY'
          import os
          import subprocess

          cmd = ["python", "linkedin_daily_bot.py", "generate"]
          track = os.environ.get("INPUT_TRACK", "").strip()
          day = os.environ.get("INPUT_DAY", "").strip()
          carousel = os.environ.get("INPUT_CAROUSEL", "false").lower() == "true"

          if track and track != "auto":
              cmd.extend(["--track", track])
          if day:
              day_num = int(day)
              if not 1 <= day_num <= 30:
                  raise ValueError(f"Day must be between 1 and 30, got {day_num}")
              cmd.extend(["--day", str(day_num)])
          if carousel:
              cmd.append("--carousel")

          subprocess.run(cmd, check=True)
          PY

      - name: Upload Post Card & Draft JSON as Artifact
        if: steps.guard.outputs.skip != 'true' && hashFiles('post_card.png') != ''
        uses: actions/upload-artifact@v4
        with:
          name: post-card
          path: |
            post_card.png
            draft_content.json
          if-no-files-found: error

      - name: Upload Carousel PDF Artifact
        if: steps.guard.outputs.skip != 'true' && hashFiles('post_carousel.pdf') != ''
        uses: actions/upload-artifact@v4
        with:
          name: post-carousel
          path: post_carousel.pdf

      - name: Push Preview Image & Draft JSON to 'previews' Branch
        if: steps.guard.outputs.skip != 'true' && hashFiles('post_card.png') != ''
        run: |
          python - <<'PY'
          import json
          import shutil
          from pathlib import Path

          draft = json.loads(Path("draft_content.json").read_text(encoding="utf-8"))
          day = int(draft.get("day", 1))
          track = str(draft.get("track", "dotnet")).strip() or "dotnet"

          out = Path("/tmp/previews_push")
          out.mkdir(parents=True, exist_ok=True)
          shutil.copy2("post_card.png", out / f"day_{track}_{day}.png")
          shutil.copy2("post_card.png", out / "latest.png")
          shutil.copy2("draft_content.json", out / f"draft_{track}_{day}.json")
          shutil.copy2("draft_content.json", out / "draft_latest.json")
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --heads origin previews >/dev/null 2>&1; then
            git fetch origin previews
            git worktree add /tmp/previews_wt origin/previews
            cd /tmp/previews_wt
            git checkout -B previews
          else
            git worktree add --orphan -b previews /tmp/previews_wt
            cd /tmp/previews_wt
            git rm -rf . >/dev/null 2>&1 || true
          fi

          mkdir -p previews
          cp /tmp/previews_push/* previews/
          git add previews/
          if ! git diff --cached --quiet; then
            git commit -m "chore: update preview card image and draft json [skip ci]"
            git push origin previews
          else
            echo "No preview changes to commit"
          fi

      - name: Close Stale Open Draft Issues & Create New Review Issue
        if: steps.guard.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO_OWNER: ${{ github.repository_owner }}
          LINKEDIN_TOKEN_UPDATED_AT: ${{ vars.LINKEDIN_TOKEN_UPDATED_AT }}
        run: |
          python - <<'PY'
          import datetime
          import json
          import os
          import re
          import subprocess
          from pathlib import Path

          # 1. Close any older open review drafts so stale issues never pile up
          existing_raw = subprocess.check_output(
              ["gh", "issue", "list", "--state", "open", "--json", "number,title"],
              text=True,
          )
          for item in json.loads(existing_raw):
              if str(item.get("title", "")).startswith("📝 Review Draft:"):
                  num = str(item["number"])
                  subprocess.run(
                      ["gh", "issue", "close", num, "--comment", "Superseded by today's new draft."],
                      check=False,
                  )

          # 2. Optional 60-day LinkedIn token expiry check (warns starting at day 50)
          token_banner = ""
          updated_raw = os.environ.get("LINKEDIN_TOKEN_UPDATED_AT", "").strip()
          if updated_raw:
              try:
                  updated_dt = datetime.date.fromisoformat(updated_raw[:10])
                  age_days = (datetime.date.today() - updated_dt).days
                  remaining = 60 - age_days
                  if remaining <= 10:
                      token_banner = (
                          f"> ⚠️ **LinkedIn Token Expiry Alert:** Your 60-day `LINKEDIN_ACCESS_TOKEN` "
                          f"is **{age_days} days old** ({max(remaining, 0)} days remaining). "
                          f"Refresh it in GitHub Secrets and update `LINKEDIN_TOKEN_UPDATED_AT`.\n\n"
                      )
              except ValueError:
                  pass

          # 3. Create today's fresh review issue pointing to the 'previews' branch
          draft = json.loads(Path("draft_content.json").read_text(encoding="utf-8"))
          title = draft["title"].strip()
          post_text = draft["post_text"].strip()
          day = int(draft.get("day", 1))
          track = str(draft.get("track", "dotnet")).strip() or "dotnet"
          issue_title = f"📝 Review Draft: Day {day} - {title}"

          repo = os.environ["GITHUB_REPOSITORY"]
          image_url = f"https://github.com/{repo}/blob/previews/previews/day_{track}_{day}.png?raw=true"
          alt_title = re.sub(r"[\[\]]", "", title)
          safe_post_text = re.sub(r"(?m)^---+$", "───", post_text)

          issue_body = (
              f"{token_banner}"
              "### 🖼️ Visual Card Preview\n"
              f"![{alt_title}]({image_url})\n\n"
              "### 📝 Post Commentary\n"
              "Review the text below. You can edit this issue body directly to tweak wording before publishing.\n\n"
              "---\n\n"
              f"{safe_post_text}\n\n"
              "---\n\n"
              "### 👉 Commands:\n"
              "- Comment **`/publish`** to post this image and text to LinkedIn & Dev.to.\n"
              "- Comment **`/regenerate`** to generate a fresh draft and card.\n"
              "- Close this issue to skip today.\n"
          )
          body_file = Path("/tmp/issue_body.md")
          body_file.write_text(issue_body, encoding="utf-8")

          owner = os.environ.get("REPO_OWNER", "").strip()
          create_cmd = ["gh", "issue", "create", "--title", issue_title, "--body-file", str(body_file)]
          if owner:
              create_cmd.extend(["--assignee", owner])

          created_url = subprocess.check_output(create_cmd, text=True).strip()

          Path(os.environ["GITHUB_STEP_SUMMARY"]).write_text(
              f"## Review Draft Created\n- **Title:** {issue_title}\n- **Issue:** {created_url}\n",
              encoding="utf-8",
          )
          PY

      - name: Notify Failure in Summary
        if: failure()
        run: |
          echo "## Draft Generation Failed" >> "$GITHUB_STEP_SUMMARY"
          echo "Check your GEMINI_API_KEY secret or API quota." >> "$GITHUB_STEP_SUMMARY"
